<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metadata</title>
  </head>
  <body>
    <header><h1>Meta Data</h1></header>

    <!--aggregate stats-->
    <div id="stats"></div>

    <!--Dot Chart-->
    <h2>Commits by Time of Day</h2>
    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>
        <dl id="commit-tooltip" class="info tooltip" hidden>
          <dt>Commit</dt>
          <dd>
            <a href="" id="commit-link" target="_blank"></a>
          </dd>

          <dt>Date</dt>
          <dd id="commit-date"></dd>

          <dt>Time</dt>
          <dd id="commit-time"></dd>

          <dt>Lines Edited</dt>
          <dd id="commit-lines"></dd>
        </dl>

        <!--Language breakdown on selection-->
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <!--Filter-->
    <div id="filter">
      <label
        >Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" />
        <time id="commit-time">11:59</time>
      </label>
    </div>
    <!--unit vis-->
    <dl id="files"></dl>

    <script type="module" src="../global.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
